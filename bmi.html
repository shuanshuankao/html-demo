<!DOCTYPE html>
<html lang="zh-Hant">
<!-- https://www.bfa.com.tw/blog/color-tools 網頁色調調整 -->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI計算機</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .main-title {
            color: rgb(102, 255, 0);
        }

        form {
            width: 40%;
            background-color: orangered;
            margin: 24px auto;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 10px 10px 5px rgb(37, 44, 46);
        }

        input {
            margin: 6px 0px;
            font-size: 20px;
            text-align: center;
            border-radius: 6px;
        }

        /* label 文字大小 */
        label {
            font-size: 20px;
            text-shadow: 1px 1px 1px;
        }

        select {}

        /* 性別/居住縣市   使用div */
        .panel1 {
            background-color: cyan;
            padding: 6px;
            border: 2px dotted pink;
            margin: 6px;
        }

        button {
            margin-top: 1rem;
            width: 80px;
            height: 30px;
            background-color: bisque;
            border: none;
            font-size: 16px;
            border-radius: 6px;
            color: #a50f0f;
        }

        button:hover {
            background-color: blue;
            cursor: pointer;
        }

        a {
            background-color: brown;
            color: white;
            padding: 12px;
            border-radius: 6px;
            text-decoration: none;
        }

        a:hover {
            color: yellow;
        }

        #result {
            font-size: 2rem;
            font-weight: blod;
            background-color: chartreuse;
            width: 600px;
            margin: 24px auto;
            padding: 12px;
            border: 1px dotted darkblue;
        }

        #info {
            background-color: darkorange;
            padding: 3px;
        }

        .comment {
            font-size: 2rem;
            font-weight: 200;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        .bmi {
            font-size: 2.5rem;
        }


        @media screen and (max-width:600px) {
            form {
                width: 80%;
            }
        }
    </style>
</head>

<body>
    <div class="main title">BMI計算機</div>
    <form action="">
        <label for="username">姓名</label>
        <input id="username" name="username" type="text" placeholder="請輸入姓名"><br>
        <label for="age">年齡</label>
        <input id="age" name="age" type="number" value="18"><br>
        <label for="height">身高</label>
        <input id="height" name="height" type="number" step="0.1" value="178.5"><br>
        <label for="weight">體重</label>
        <input id="weight" name="weight" type="number" step="0.1"><br>
        <div>
            <input type="radio" name="sex" id="male" checked value="男生"> 男
            <input type="radio" name="sex" id="female" value="女生"> 女
            <!-- <input type="file" name="" id=""> --> 加入附檔

            <label for="county">居住縣市</label>
            <select name="county" id="county">
                <option value="台北市">台北市</option>
                <option value="新北市">新北市</option>
                <option value="桃園市">桃園市</option>
                <option value="台中市">台中市</option>
                <option value="台南市">台南市</option>
                <option value="高雄市">高雄市</option>
            </select>
        </div>
        <br>
        <button type="button" onclick="calc()">計算</button>

    </form>

    <!-- 新增 id => info -->
    <!-- 將使用者的名字跟年齡 -->
    <div id="info">
        <!-- info#   or   div#info -->
    </div>

    <div id="result">
        BMI:<span class="bmi">

        </span>
        <p class="comment">

        </p>
    </div>

    <a href="workout.html">首頁</a>

    <script>
        const nameEl = document.querySelector("#username");
        const ageEl = document.querySelector("#age");
        const heightEl = document.querySelector("#height");
        const weightEl = document.querySelector("#weight");
        const countyEl = document.querySelector("#county");
        const sexEl = document.querySelector("input[name='sex']:checked");
        // console.log(sexEl, countyEl.value, nameEl, ageEl, heightEl, weightEl, heightEl.value, weightEl.value);

        function calc() {
            let height = heightEl.value;
            let weight = weightEl.value;
            // 判斷 height 跟 weight 要大於0跟是數值 not isNan跟 weight 要大於0跟是數值 not isNan
            // and ==> &&   or ==> ||
            if (height <= 0 || weight <= 0) {
                alert("請輸入正確數值!");
                return;
            }

            // 取得最新的選取
            let sexEl = document.querySelector("input[name='sex']:checked");
            let userInfo = `${nameEl.value}  年齡:${ageEl.value}   性別:${sexEl.value}   縣市:${countyEl.value}`;
            console.log(userInfo);
            document.querySelector("info").innerHTML = `<h1> ${userInfo} </h1>`;

            let bmi = getBmi(height, weight);
            let result = getComment(bmi);
            console.log(bmi, result[0], result[1]);
            const bmiEl = document.querySelector(".bmi");
            bmiEl.innerText = bmi;
            bmiEl.style.color = result[1];
            document.querySelector(".comment").innerText = result[0];


            // document.querySelector("#result").innerHTML = "<h1>BMI:" + bmi + "</h1>";
            // document.querySelector("#result").innerHTML = `<h1> BMI:${bmi}<br>${comment} </h1>`;
        }

        function getComment(bmi) {
            let commit;
            if (bmi < 18.5) {
                comment = "「體重過輕」，需要多運動，均衡飲食，以增加體能，維持健康！";
                color = "cyan";
            } else if (bmi < 24) {
                comment = "恭喜！「健康體重」，要繼續保持！";
                color = "green";
            } else if (bmi < 27) {
                comment = "「體重過重」了，要小心囉，趕快力行「健康體重管理」！";
                color = "orange";
            } else {
                comment = "啊～「肥胖」，需要立刻力行「健康體重管理」囉！";
                color = "red";
            }

            return [comment, color];
        }
        // let x = 10;
        // let y = 20;
        // let z = x + y;
        // // 判斷式
        // if (x > 10) {

        // } else if (y > 20) {

        // } else {
        //     console.log(x, y);
        // }

        // // and or not
        // x = "10";
        // y = 10;
        // // 型態跟值都要相同
        // console.log(x === y);
        // // and ==> &&    or ==> |   not ==>!
        // if (x >= 10 && y >= 30) {
        //     console.log("1");
        // }
        // if (x >= 10 || y >= 30) {
        //     console.log("1");
        // }

        // let a = false;
        // if (!a) {
        //     console.log(a);
        // }

        // let height = prompt("請輸入身高 : ");
        // let weight = prompt("請輸入體重 : ");
        // let bmi = getBmi(height, weight);
        // alert("BMI:" + bmi);
        // 函式宣告
        function getBmi(height, weight) {
            const bmi = weight / (height / 100) ** 2;
            // console.log(bmi.toFixed(2));
            return bmi.toFixed(2);
        }


    </script>

</body>

</html>
